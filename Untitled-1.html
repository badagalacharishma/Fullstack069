<!DOCTYPE html>
<html>
<head>
    <title>Simple Static Webpage</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightgray;
        }

        header {
            background-color: blue;
            color: white;
            text-align: center;
            padding: 10px;
        }

        nav {
            background-color: black;
            text-align: center;
            padding: 10px;
        }

        nav a {
            color: white;
            margin: 10px;
            text-decoration: none;
        }

        section {
            background-color: white;
            margin: 20px;
            padding: 20px;
        }

        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 8px;
        }

        footer {
            background-color: black;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>

<body>

<header>
    <h1>My Static Webpage</h1>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
</nav>

<section>

    <h2>About HTML</h2>
    <p>HTML is used to create web pages.</p>

    <img src="https://via.placeholder.com/300x150" alt="Image">

    <h3>HTML Features</h3>
    <ul>
        <li>Easy to Learn</li>
        <li>Simple</li>
        <li>Fast</li>
    </ul>

    <h3>Student Table</h3>

    <table>
        <tr>
            <th>Name</th>
            <th>Course</th>
        </tr>
        <tr>
            <td>Rahul</td>
            <td>HTML</td>
        </tr>
        <tr>
            <td>Priya</td>
            <td>CSS</td>
        </tr>
    </table>

    <h3>Contact Form</h3>

    <form>
        Name:<br>
        <input type="text"><br><br>

        Email:<br>
        <input type="email"><br><br>

        Message:<br>
        <textarea></textarea><br><br>

        <input type="submit" value="Submit">
    </form>

</section>

<footer>
    <p>© 2026 My Webpage</p>
</footer>

</body>
</html>
