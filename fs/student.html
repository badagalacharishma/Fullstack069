<!DOCTYPE html>
<html>
<head>
    <title>Student Profile Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Student Profile Manager</h1>

    <div class="form-container">
        <input type="text" id="name" placeholder="Enter Name">
        <input type="text" id="rollNo" placeholder="Enter Roll Number">
        <input type="text" id="department" placeholder="Enter Department">
        <input type="number" id="cgpa" placeholder="Enter CGPA" step="0.01">

        <button id="createBtn">Create Student Profile</button>
    </div>

    <div id="profileContainer"></div>

    <script src="script.js"></script>
</body>
</html>
