<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v2 of week1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color:rgb(199, 134, 134);
            padding: 4px;

        }
        /* the # is used for unique element here we give main nav at center only for once */
         #main-nav {
        
            background-color: #f5ff9a;
            padding: 15px;
            border: 8px solid black;
            border-radius: 8px;
            color: rgb(24, 24, 24);
            text-align: center;
            box-shadow: 0PX 4PX 4PX rgb(36, 41, 28);
        }
        /* using . we create a class 
        class is usefull dor using the same frame or buttons repeatedly instead of creating evrytjhing again and again we can use class*/
        .item-card{
            background-color: rgb(255, 98, 106);
            border:2px solid #92e0da;
            border-radius: 12px;
            padding: 22px;
            margin: 8px;
            box-shadow: 0px 2px 5px  #32413f;
            flex: 1;
        }
        /* button is created */
        .btn-main{
            background-color: bisque;
            color: rgb(37, 19, 104);
            padding: 12px 8px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0PX 8PX 12PX rgb(7, 4, 26);
            transition: backgr;
        }
        /* I AM MAKING Card for the box at button to getstarted or at the start */
        .card{
            width: 200px;
            height: 130px;
            padding: 8px;
            margin: 20px auto;
            background-color: slategray;
            border: 8px ;
            border-radius: 10px;
            font-family : Arial, sans-serif;
            text-align:center;
            box-shadow: 0px 4px 4px black;
        }
        .container{
            display: flex;
            justify-content: center;
        }
        .grid-con{
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 20px
            ;
        }
        .dash-container{
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }
    </style>
</head>

    <nav id ="main-nav">

<!--used classes in the div-->
<div class="grid-con">
