<!DOCTYPE html>
<html>
<head>
<title>My Styled Webpage</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(to right, #d9eaff, #ffffff);
    margin: 20px;
}

.container {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0px 5px 10px gray;
}

header {
    background-color: #4a6cf7;
    color: white;
    text-align: center;
    padding: 20px;
    border-radius: 10px;
    text-shadow: 2px 2px 4px black;
}

nav {
    background-color: #333;
    padding: 10px;
    margin: 15px 0;
    border-radius: 8px;
}

nav a {
    color: white;
    text-decoration: none;
    padding: 10px;
    margin: 10px;
}

nav a:hover {
    background-color: orange;
    border-radius: 5px;
}

canvas {
    display: block;
    margin: auto;
    border: 3px solid #4a6cf7;
    border-radius: 8px;
}

.cards {
    display: flex;
    gap: 15px;
    margin-top: 20px;
}

.card {
    flex: 1;
    background-color: #eeeeee;
    padding: 15px;
    border: 2px solid #4a6cf7;
    border-radius: 10px;
    box-shadow: 0px 3px 8px gray;
    text-align: center;
}

.card:hover {
    background-color: #4a6cf7;
    color: white;
}

button {
    background-color: #4a6cf7;
    color: white;
    padding: 8px 20px;
    border: none;
    border-radius: 5px;
}

button:hover {
    background-color: green;
}

footer {
    margin-top: 20px;
    background-color: #333;
    color: white;
    padding: 15px;
    text-align: center;
    border-radius: 8px;
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>My Styled Webpage</h1>
    <p>HTML5 Canvas and CSS3 Styling</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Canvas</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
</nav>

<canvas id="myCanvas" width="700" height="250"></canvas>

<div class="cards">

    <div class="card">
        <h3>HTML5</h3>
        <p>Used to create webpage structure.</p>
        <button>Learn</button>
    </div>

    <div class="card">
        <h3>CSS3</h3>
        <p>Used for webpage styling.</p>
        <button>Learn</button>
    </div>

    <div class="card">
        <h3>Canvas</h3>
        <p>Used for drawing graphics.</p>
        <button>Learn</button>
    </div>

</div>

<footer>
    <p>Created by B. Charishma</p>
</footer>

</div>

<script>

let canvas = document.getElementById("myCanvas");
let ctx = canvas.getContext("2d");

// Rectangle
ctx.fillStyle = "blue";
ctx.fillRect(50,50,150,80);

// Circle
ctx.beginPath();
ctx.arc(300,90,50,0,Math.PI*2);
ctx.fillStyle = "red";
ctx.fill();

// Line
ctx.beginPath();
ctx.moveTo(430,50);
ctx.lineTo(600,150);
ctx.strokeStyle = "green";
ctx.lineWidth = 5;
ctx.stroke();

// Name
ctx.font = "30px Arial";
ctx.fillStyle = "purple";
ctx.fillText("B. Charishma",250,220);

</script>

</body>
</html>
